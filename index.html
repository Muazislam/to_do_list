<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h1 class="h4 mb-0"><i class="bi bi-check2-square me-2"></i>My To-Do List</h1>
                    </div>
                    <div class="card-body">
                        <form id="todo-form" class="d-flex gap-2 mb-4">
                            <input type="text" id="todo-input" class="form-control" placeholder="Add a new task..." autocomplete="off" required>
                            <button type="submit" class="btn btn-primary flex-shrink-0">
                                <i class="bi bi-plus-lg"></i> Add
                            </button>
                        </form>

                        <div class="btn-group w-100 mb-3" role="group" aria-label="Filters">
                            <button class="btn btn-outline-primary active" data-filter="all">All</button>
                            <button class="btn btn-outline-primary" data-filter="active">Active</button>
                            <button class="btn btn-outline-primary" data-filter="completed">Completed</button>
                        </div>

                        <ul id="todo-list" class="list-group"></ul>

                        <div id="empty-state" class="text-center text-muted py-4 d-none">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            <p class="mb-0">No tasks yet. Add one above!</p>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span id="task-count" class="text-muted small"></span>
                            <button id="clear-completed" class="btn btn-link btn-sm text-danger p-0">
                                Clear completed
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
